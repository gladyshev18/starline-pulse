name: starline-pulse

services:
  migrate:
    build:
      context: .
      target: tasks
    image: ${TASKS_IMAGE:-starline-pulse-tasks:local}
    command: ["npm", "run", "db:migrate"]
    env_file: .env.production
    environment:
      DATABASE_URL: file:/app/data/app.db
    volumes:
      - app-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  seed:
    image: ${TASKS_IMAGE:-starline-pulse-tasks:local}
    command: ["npm", "run", "seed"]
    profiles: ["tools"]
    env_file: .env.production
    environment:
      DATABASE_URL: file:/app/data/app.db
    volumes:
      - app-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  web:
    build:
      context: .
      target: web
    image: ${WEB_IMAGE:-starline-pulse-web:local}
    env_file: .env.production
    environment:
      DATABASE_URL: file:/app/data/app.db
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    volumes:
      - app-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  worker:
    image: ${TASKS_IMAGE:-starline-pulse-tasks:local}
    command: ["npm", "run", "worker:start"]
    env_file: .env.production
    environment:
      DATABASE_URL: file:/app/data/app.db
      NODE_ENV: production
    volumes:
      - app-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/www/acme:/var/www/acme:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  app-data:
  caddy-data:
  caddy-config:
